<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Mela!</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }
      .slide {
        display: none;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        text-align: center;
        transition: all 0.5s ease-in-out;
        padding: 20px;
      }
      .active {
        display: flex;
      }
      .slide1 {
        background: linear-gradient(135deg, #ffdde1, #ee9ca7);
        flex-direction: column;
        position: relative;
      }
      .css-gift {
        position: relative;
        width: 130px;
        height: 130px;
        background: #ff6f91;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      .css-gift::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 30px;
        background: #ff9671;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
        transform-origin: top;
        transition: transform 0.6s ease;
        z-index: 2;
      }
      .gift-open::before {
        transform: rotateX(120deg) translateX(-50%);
      }
      .css-ribbon {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 20px;
        height: 100%;
        background: #f9f871;
        z-index: 1;
      }
      .css-ribbon::before,
      .css-ribbon::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 40px;
        height: 15px;
        background: #f9f871;
        border-radius: 10px;
      }
      .css-ribbon::before {
        left: -45px;
        transform: rotate(-45deg);
      }
      .css-ribbon::after {
        right: -45px;
        transform: rotate(45deg);
      }
      .sparkle {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        animation: sparkle 1s ease-out forwards;
        opacity: 0.8;
      }
      .character {
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        animation: characterPop 1s ease-out 1s forwards;
        z-index: 10;
      }
      .unicorn {
        position: relative;
        width: 80px;
        height: 65px;
        background: #fff;
        border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
        margin: 0 auto;
      }
      .unicorn::before {
        content: "";
        position: absolute;
        top: -15px;
        left: 35px;
        width: 8px;
        height: 20px;
        background: linear-gradient(to bottom, #f9f871, #ff6f91);
        transform: rotate(-20deg);
        border-radius: 5px;
      }
      .eye {
        position: absolute;
        width: 5px;
        height: 5px;
        background: #000;
        border-radius: 50%;
        top: 25px;
      }
      .eye.left {
        left: 18px;
      }
      .eye.right {
        right: 18px;
      }
      @keyframes characterPop {
        to {
          transform: translate(-50%, -50%) scale(1);
        }
      }
      @keyframes sparkle {
        from {
          transform: scale(0.5) translateY(0);
          opacity: 1;
        }
        to {
          transform: scale(1.5) translateY(-100px);
          opacity: 0;
        }
      }
      .slide2 {
        background: #ffc0cb;
        color: #6b2b90;
        flex-direction: column;
        position: relative;
        animation: fadeIn 1s ease-in-out;
      }
      h1 {
        font-size: 2em;
        color: #ff69b4;
        margin-bottom: 10px;
        animation: popIn 1s ease-in-out;
      }
      .message {
        max-width: 90%;
        font-size: 1.1em;
        padding: 15px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        animation: bounceIn 1.5s ease;
      }
      @keyframes popIn {
        from {
          transform: scale(0);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes bounceIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        60% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <audio
      id="popSound"
      src="https://www.soundjay.com/buttons/sounds/button-16.mp3"
    ></audio>

    <div class="slide slide1 active" id="slide1">
      <h2 style="color: #fff; font-size: 1.3em; margin-bottom: 20px">
        Pencet Mel 🎁
      </h2>
      <div class="css-gift" id="gift" onclick="openGift()">
        <div class="css-ribbon"></div>
      </div>
      <div class="character" id="character">
        <div class="unicorn">
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>
      </div>
    </div>

    <div class="slide slide2" id="slide2">
      <h1>🎀 Happy Birthday Mela 🎀</h1>
      <div class="message">
        Ciye 18 tahun 🎉<br />
        Wish you all the best mel. Semoga menjadi anak yang sholehah, rajin
        membantu, rajin menabung dan lain lain. Semoga menjadi ketua AOS yang
        amanah. Semoga yang disemogakan tersemogakan
      </div>
    </div>

    <script>
      function createSparkles() {
        const gift = document.getElementById("gift");
        for (let i = 0; i < 20; i++) {
          const sparkle = document.createElement("div");
          sparkle.className = "sparkle";
          sparkle.style.left = Math.random() * 100 + "%";
          sparkle.style.top = Math.random() * 100 + "%";
          gift.appendChild(sparkle);
          setTimeout(() => sparkle.remove(), 1000);
        }
      }

      function openGift() {
        const gift = document.getElementById("gift");
        const sound = document.getElementById("popSound");
        const character = document.getElementById("character");
        gift.classList.add("gift-open");
        sound.play();
        createSparkles();
        character.style.display = "block";
        setTimeout(() => {
          document.getElementById("slide1").classList.remove("active");
          document.getElementById("slide2").classList.add("active");
        }, 2500);
      }
    </script>
  </body>
</html>
